# checks.yml: CI for mayankgautam-me. A push or pull request runs the parts whose folder changed.
# Generated by the project-standard skill (project-standard v1.5). Each job calls a reusable workflow in
# mayankgautam-me/ci-templates, which runs make <part>-<verb>, so CI does what you run locally.
# Add jobs at the end; make ci-lint checks this file.
name: checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  changes:
    runs-on: ${{ vars.STD_RUNNER || 'ubuntu-24.04' }}
    outputs:
      web: ${{ steps.changes.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          all=0
          files=''
          if [[ -z $BASE || $BASE =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            all=1
          else
            files=$(git diff --name-only "$BASE" HEAD)
          fi
          changed() {
            local dir=$1 f
            if ((all == 1)); then return 0; fi
            while IFS= read -r f; do
              case $f in
                "$dir"/* | make/* | Makefile | mise.toml | .github/workflows/*) return 0 ;;
              esac
            done <<<"$files"
            return 1
          }
          {
            if changed 'web'; then echo 'web=true'; else echo 'web=false'; fi
          } >>"$GITHUB_OUTPUT"
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    permissions:
      actions: read
      contents: write
    uses: mayankgautam-me/ci-templates/.github/workflows/web-pages.yml@v1.5
    with:
      part: web
      part_dir: web
      run_check: true
      run_build: true
      run_release: false
      production_only: true
      deploy_staging: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets:
      SECRETS_DEPLOY_KEY: ${{ secrets.SECRETS_DEPLOY_KEY }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

