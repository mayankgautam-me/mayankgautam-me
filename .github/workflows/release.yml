# release.yml: release for mayankgautam-me. A tag <part>-v<version> (make <part>-bump) runs that part's job.
# Generated by the project-standard skill (project-standard v1.6). Each job calls a reusable workflow in
# mayankgautam-me/ci-templates, which runs make <part>-<verb>, so CI does what you run locally.
# Add jobs at the end; make ci-lint checks this file.
name: release

on:
  push:
    tags: ['*-v*']
  workflow_dispatch:
    inputs:
      part:
        description: 'the part to send to production (its name in make/project.mk)'
        required: false
        type: string
      confirm:
        description: 'type production to run the production step'
        required: false
        type: string
      source_run_id:
        description: 'firmware: the run that built the part (its build artifacts); empty builds again'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: ${{ vars.STD_RUNNER || 'ubuntu-24.04' }}
    outputs:
      part: ${{ steps.part.outputs.part }}
    steps:
      - id: part
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            echo "part=${REF_NAME%-v*}" >>"$GITHUB_OUTPUT"
          else
            echo "part=" >>"$GITHUB_OUTPUT"
          fi
  web-release:
    needs: tag
    if: needs.tag.outputs.part == 'web'
    permissions:
      actions: read
      contents: write
    uses: mayankgautam-me/ci-templates/.github/workflows/web-pages.yml@v1.6
    with:
      part: web
      part_dir: web
      run_check: true
      run_build: true
      run_release: true
      confirm: production
      production_only: true
    secrets:
      SECRETS_DEPLOY_KEY: ${{ secrets.SECRETS_DEPLOY_KEY }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

  latest:
    needs: [tag, web-release]
    if: always() && (needs.web-release.result == 'success')
    runs-on: ${{ vars.STD_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: write
    concurrency:
      group: release-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy the part's Release into the latest Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PART: ${{ needs.tag.outputs.part }}
          REF_NAME: ${{ github.ref_name }}
        run: make "$PART-release-latest" VERSION="${REF_NAME##*-v}"

  web-production:
    if: github.event_name == 'workflow_dispatch' && inputs.part == 'web' && inputs.confirm == 'production'
    permissions:
      actions: read
      contents: write
    uses: mayankgautam-me/ci-templates/.github/workflows/web-pages.yml@v1.6
    with:
      part: web
      part_dir: web
      run_check: true
      run_build: true
      run_release: false
      confirm: ${{ inputs.confirm }}
      production_only: true
    secrets:
      SECRETS_DEPLOY_KEY: ${{ secrets.SECRETS_DEPLOY_KEY }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

